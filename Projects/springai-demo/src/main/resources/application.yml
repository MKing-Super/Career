spring:
  application:
    name: springai-demo
  ai:
    openai:
      base-url: https://opencode.ai/zen
      api-key:
      chat:
        options:
          model: big-pickle
          temperature: 0.8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/home?useSSL=false&characterEncoding=utf8
    username: root
    password: 123
logging:
  level:
    org.springframework.ai: debug # AI对话的日志级别
    com.xbs.springaiopenai: debug # 本项目的日志级别
server:
  port: 8090
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl