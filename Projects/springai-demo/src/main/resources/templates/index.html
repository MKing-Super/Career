<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #0c0c0c;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-input: #2e2e2e;
            --border-color: #333;
            --text-primary: #fff;
            --text-secondary: #888;
            --accent: #543add;
            --accent-hover: #6b5ae9;
            --accent-disabled: #444;
            --danger: #ff4444;
            --code-bg: #2e2e2e;
        }

        .theme-light {
            --bg-primary: #f5f5f5;
            --bg-secondary: #fff;
            --bg-tertiary: #e0e0e0;
            --bg-input: #fff;
            --border-color: #ddd;
            --text-primary: #333;
            --text-secondary: #666;
            --accent: #543add;
            --accent-hover: #6b5ae9;
            --accent-disabled: #ccc;
            --danger: #ff4444;
            --code-bg: #e8e8e8;
        }

        .theme-blue {
            --bg-primary: #0a1929;
            --bg-secondary: #0d2137;
            --bg-tertiary: #143352;
            --bg-input: #143352;
            --border-color: #1a4a6e;
            --text-primary: #e6f1ff;
            --text-secondary: #8b9dc3;
            --accent: #64ffda;
            --accent-hover: #80ffd4;
            --accent-disabled: #1a4a6e;
            --danger: #ff6b6b;
            --code-bg: #143352;
        }

        .theme-green {
            --bg-primary: #0a1612;
            --bg-secondary: #0f231c;
            --bg-tertiary: #153028;
            --bg-input: #153028;
            --border-color: #1a4030;
            --text-primary: #e6ffe6;
            --text-secondary: #8bc9a3;
            --accent: #00d26a;
            --accent-hover: #00e676;
            --accent-disabled: #1a4030;
            --danger: #ff6b6b;
            --code-bg: #153028;
        }

        .theme-pink {
            --bg-primary: #fff0f5;
            --bg-secondary: #fff;
            --bg-tertiary: #ffd6e0;
            --bg-input: #fff;
            --border-color: #ffc0cb;
            --text-primary: #5c3a4a;
            --text-secondary: #8b6b7a;
            --accent: #ff69b4;
            --accent-hover: #ff85c1;
            --accent-disabled: #e0c0cb;
            --danger: #ff6b6b;
            --code-bg: #ffe4eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; }
        
        .sidebar { width: 0; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: width 0.3s; }
        .sidebar.show { width: 280px; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); white-space: nowrap; background: var(--bg-secondary); }
        .new-chat-btn { width: 100%; background: var(--accent); border: none; color: var(--bg-primary); padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .new-chat-btn:hover { background: var(--accent-hover); }
        
        .session-list { flex: 1; overflow-y: auto; padding: 10px; background: var(--bg-secondary); }
        .session-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); }
        .session-item:hover { background: var(--bg-tertiary); }
        .session-item.active { background: var(--bg-tertiary); }
        .session-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--text-primary); }
        .session-actions { display: none; gap: 4px; }
        .session-item:hover .session-actions { display: flex; }
        .session-action-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; font-size: 12px; }
        .session-action-btn:hover { color: var(--text-primary); }
        .session-action-btn.delete:hover { color: var(--danger); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; }
        
        .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .toggle-sidebar-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 20px; padding: 4px 8px; }
        .toggle-sidebar-btn:hover { color: var(--text-primary); }
        .chat-title { font-size: 16px; font-weight: 500; }
        .current-session-name { color: var(--text-secondary); font-size: 14px; }
        
        .theme-switcher { position: relative; }
        .theme-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; padding: 4px 8px; }
        .theme-btn:hover { color: var(--text-primary); }
        .theme-dropdown { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; z-index: 100; min-width: 120px; }
        .theme-dropdown.show { display: block; }
        .theme-option { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .theme-option:hover { background: var(--bg-tertiary); }
        .theme-option.active { background: var(--bg-tertiary); }
        .theme-option.active .theme-color { border-color: var(--accent); box-shadow: 0 0 4px var(--accent); }
        .theme-color { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-color); }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 20px; display: flex; gap: 16px; }
        .message.user { justify-content: flex-end; }
        .message-avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .message.user .message-avatar { background: var(--accent); color: var(--bg-primary); order: 1; }
        .message.ai .message-avatar { background: var(--bg-tertiary); }
        .message-content { max-width: 700px; font-size: 15px; line-height: 1.6; }
        .message-content pre { white-space: pre-wrap; white-space: -moz-pre-wrap; white-space: -o-pre-wrap; word-wrap: break-word; }
        .message-content p { margin-bottom: 12px; }
        .message-content h1, .message-content h2, .message-content h3 { color: var(--text-primary); margin: 16px 0 8px; }
        .message-content h1 { font-size: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .message-content h2 { font-size: 20px; }
        .message-content h3 { font-size: 16px; }
        .message-content code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .message-content pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
        .message-content pre code { background: none; padding: 0; }
        .message-content ul, .message-content ol { padding-left: 20px; margin: 12px 0; }
        .message-content hr { border: none; border-top: 1px solid var(--border-color); margin: 16px 0; }
        
        .input-container { padding: 20px 40px 30px; border-top: 1px solid var(--border-color); }
        .input-wrapper { background: var(--bg-input); border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: flex-end; }
        .input-wrapper textarea { flex: 1; background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; font-family: inherit; max-height: 200px; line-height: 1.5; }
        .input-wrapper textarea::placeholder { color: var(--text-secondary); }
        .send-btn { background: var(--accent); border: none; color: var(--bg-primary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { background: var(--accent-disabled); cursor: not-allowed; }
        
        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .welcome h1 { font-size: 36px; font-weight: 500; margin-bottom: 16px; }
        .welcome p { color: var(--text-secondary); font-size: 15px; }
        
        .session-list .session-item, .session-list .new-chat-btn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-secondary); padding: 24px; border-radius: 12px; width: 400px; }
        .modal-title { font-size: 18px; margin-bottom: 16px; }
        .modal-input { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
        .modal-btn.cancel { background: var(--bg-tertiary); color: var(--text-primary); }
        .modal-btn.confirm { background: var(--accent); color: var(--bg-primary); }
        
        .time-badge { font-size: 11px; color: var(--text-secondary); margin-left: 8px; }
        
        .message-footer { display: flex; gap: 8px; margin-top: 8px; }
        .export-btn { background: var(--bg-tertiary); border: none; color: var(--text-secondary); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .export-btn:hover { background: var(--border-color); color: var(--text-primary); }
    </style>
</head>
<body onload="init()">
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewSession()">+ 新建会话</button>
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>
    
    <div class="main-content">
        <div class="chat-header">
            <div class="header-left">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="切换侧边栏">☰</button>
                <div>
                    <div class="chat-title">AI 助手</div>
                    <div class="current-session-name" id="currentSessionName">新会话</div>
                </div>
            </div>
            <div class="theme-switcher">
                <button class="theme-btn" onclick="toggleThemeDropdown()">🎨</button>
                <div class="theme-dropdown" id="themeDropdown">
                    <div class="theme-option" data-theme="dark" onclick="setTheme('dark')">
                        <div class="theme-color" style="background: #0c0c0c;"></div>
                        <span>深色</span>
                    </div>
                    <div class="theme-option" data-theme="light" onclick="setTheme('light')">
                        <div class="theme-color" style="background: #f5f5f5;"></div>
                        <span>浅色</span>
                    </div>
                    <div class="theme-option" data-theme="blue" onclick="setTheme('blue')">
                        <div class="theme-color" style="background: #0a1929;"></div>
                        <span>蓝色</span>
                    </div>
                    <div class="theme-option" data-theme="green" onclick="setTheme('green')">
                        <div class="theme-color" style="background: #0a1612;"></div>
                        <span>绿色</span>
                    </div>
                    <div class="theme-option" data-theme="pink" onclick="setTheme('pink')">
                        <div class="theme-color" style="background: #fff0f5;"></div>
                        <span>粉色</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chat-messages" id="messages">
            <div class="welcome">
                <h1>你好，我是 AI 助手</h1>
                <p>有什么我可以帮助你的吗？</p>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="prompt" placeholder="发送消息..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="send()">发送</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <div class="modal-title">重命名会话</div>
            <input type="text" class="modal-input" id="newSessionName" placeholder="输入会话名称">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeRenameModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmRename()">确定</button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = '';
        let sidebarVisible = false;
        let renameTargetId = '';

        function toggleSidebar() {
            sidebarVisible = !sidebarVisible;
            document.querySelector('.sidebar').classList.toggle('show', sidebarVisible);
        }

        function toggleThemeDropdown() {
            document.getElementById('themeDropdown').classList.toggle('show');
        }

        function setTheme(theme) {
            document.body.className = theme === 'dark' ? '' : 'theme-' + theme;
            localStorage.setItem('chatTheme', theme);
            updateThemeOptions();
            toggleThemeDropdown();
        }

        function updateThemeOptions() {
            const currentTheme = localStorage.getItem('chatTheme') || 'dark';
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('active');
                if (opt.dataset.theme === currentTheme) {
                    opt.classList.add('active');
                }
            });
        }

        function initTheme() {
            const theme = localStorage.getItem('chatTheme') || 'dark';
            if (theme !== 'dark') {
                document.body.className = 'theme-' + theme;
            }
            updateThemeOptions();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.theme-switcher')) {
                document.getElementById('themeDropdown').classList.remove('show');
            }
        });

        async function init() {
            initTheme();
            await loadSessions();
        }

        async function loadSessions() {
            try {
                const res = await fetch('/ai/sessions');
                const sessions = await res.json();
                const list = document.getElementById('sessionList');
                list.innerHTML = '';
                sessions.forEach(session => {
                    const item = document.createElement('div');
                    item.className = 'session-item' + (session.sessionId === currentSessionId ? ' active' : '');
                    item.innerHTML = `
                        <span class="session-name" onclick="selectSession('${session.sessionId}')">${session.sessionName}</span>
                        <div class="session-actions">
                            <button class="session-action-btn" onclick="openRenameModal('${session.sessionId}', '${session.sessionName}')" title="重命名">✎</button>
                            <button class="session-action-btn delete" onclick="deleteSession('${session.sessionId}')" title="删除">✕</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                console.error('加载会话列表失败', err);
            }
        }

        async function createNewSession() {
            try {
                const res = await fetch('/ai/session', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
                const data = await res.json();
                currentSessionId = data.sessionId;
                document.getElementById('currentSessionName').textContent = data.sessionName;
                document.getElementById('messages').innerHTML = '<div class="welcome"><h1>你好，我是 AI 助手</h1><p>有什么我可以帮助你的吗？</p></div>';
                await loadSessions();
            } catch (err) {
                console.error('创建会话失败', err);
            }
        }

        async function selectSession(sessionId) {
            currentSessionId = sessionId;
            await loadSessions();
            
            try {
                const res = await fetch('/ai/session/' + sessionId + '/messages');
                const messages = await res.json();
                
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                
                if (messages.length === 0) {
                    messagesDiv.innerHTML = '<div class="welcome"><h1>你好，我是 AI 助手</h1><p>有什么我可以帮助你的吗？</p></div>';
                } else {
                    messages.forEach(msg => {
                        addMessage(msg.role, msg.content, msg.createTime, true);
                    });
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
                
                const sessionRes = await fetch('/ai/sessions');
                const sessions = await sessionRes.json();
                const session = sessions.find(s => s.sessionId === sessionId);
                if (session) {
                    document.getElementById('currentSessionName').textContent = session.sessionName;
                }
            } catch (err) {
                console.error('加载消息失败', err);
            }
        }

        function openRenameModal(sessionId, currentName) {
            event.stopPropagation();
            renameTargetId = sessionId;
            document.getElementById('newSessionName').value = currentName;
            document.getElementById('renameModal').classList.add('show');
        }

        function closeRenameModal() {
            document.getElementById('renameModal').classList.remove('show');
        }

        async function confirmRename() {
            const newName = document.getElementById('newSessionName').value.trim();
            if (!newName) return;
            
            try {
                await fetch('/ai/session/' + renameTargetId, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: newName })
                });
                closeRenameModal();
                await loadSessions();
                
                if (currentSessionId === renameTargetId) {
                    document.getElementById('currentSessionName').textContent = newName;
                }
            } catch (err) {
                console.error('重命名失败', err);
            }
        }

        async function deleteSession(sessionId) {
            event.stopPropagation();
            if (!confirm('确定要删除该会话吗？')) return;
            
            try {
                await fetch('/ai/session/' + sessionId, { method: 'DELETE' });
                if (currentSessionId === sessionId) {
                    currentSessionId = '';
                    document.getElementById('currentSessionName').textContent = '新会话';
                    document.getElementById('messages').innerHTML = '<div class="welcome"><h1>你好，我是 AI 助手</h1><p>有什么我可以帮助你的吗？</p></div>';
                }
                await loadSessions();
            } catch (err) {
                console.error('删除失败', err);
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        }

        async function send() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return;
            
            if (!currentSessionId) {
                await createNewSession();
            }
            
            const sendBtn = document.querySelector('.send-btn');
            sendBtn.disabled = true;
            
            addMessage('user', prompt);
            document.getElementById('prompt').value = '';
            
            const aiMessage = addMessage('ai', '', null, false);
            const contentTextDiv = aiMessage.querySelector('.content-text');
            
            try {
                const res = await fetch('/ai/chat?prompt=' + encodeURIComponent(prompt) + '&sessionId=' + currentSessionId);
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    if (typeof marked !== 'undefined') {
                        contentTextDiv.innerHTML = marked.parse(fullText);
                    } else {
                        contentTextDiv.innerText = fullText;
                    }
                    aiMessage.dataset.content = fullText;
                    messages.scrollTop = messages.scrollHeight;
                }
                
                const exportBtn = aiMessage.querySelector('.export-btn');
                if (exportBtn) exportBtn.disabled = false;
                
                await loadSessions();
            } catch (err) {
                contentTextDiv.innerHTML = '<p style="color: #ff4444;">请求出错，请重试</p>';
            }
            
            sendBtn.disabled = false;
        }

        function addMessage(role, content, createTime, enableExport = false) {
            const messages = document.getElementById('messages');
            const welcome = messages.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            const div = document.createElement('div');
            div.className = 'message ' + role;
            
            let html = '';
            if (typeof marked !== 'undefined' && content) {
                html = marked.parse(content);
            } else {
                html = content || '';
            }
            
            const timeHtml = createTime ? `<span class="time-badge">${formatTime(createTime)}</span>` : '';
            let footerHtml = '';
            if (role === 'ai' || role === 'assistant') {
                const disabled = enableExport ? '' : 'disabled';
                footerHtml = '<div class="message-footer"><button class="export-btn" onclick="exportMarkdown(this)" ' + disabled + '>导出 MD</button></div>';
                div.dataset.content = content || '';
            }
            
            const avatarText = (role === 'user' || role === 'assistant') ? (role === 'user' ? 'U' : 'AI') : role.charAt(0).toUpperCase();
            div.innerHTML = '<div class="message-avatar">' + avatarText + '</div><div class="message-content"><div class="content-text"></div>' + timeHtml + footerHtml + '</div>';
            const contentTextDiv = div.querySelector('.content-text');
            contentTextDiv.innerHTML = html;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function exportMarkdown(btn) {
            const messageDiv = btn.closest('.message');
            const content = messageDiv.dataset.content;
            if (!content) return;
            
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ai回复_' + formatDateTime(new Date()) + '.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function formatDateTime(date) {
            return date.getFullYear() + '-' + 
                   String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(date.getDate()).padStart(2, '0') + '_' + 
                   String(date.getHours()).padStart(2, '0') + '-' + 
                   String(date.getMinutes()).padStart(2, '0') + '-' + 
                   String(date.getSeconds()).padStart(2, '0');
        }

        function formatTime(dateStr) {
            const date = new Date(dateStr);
            return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }
    </script>
</body>
</html>
