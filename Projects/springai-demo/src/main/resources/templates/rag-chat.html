<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能对话 - 阿坤AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        .nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .nav a { color: #666; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .nav a:hover { background: #f0f0f0; }
        .nav a.active { background: #007AFF; color: white; }

        .chat-container { height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 15px; padding: 12px 15px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
        .message.user { background: #007AFF; color: white; margin-left: auto; }
        .message.assistant { background: white; border: 1px solid #eee; }
        .message.system { background: #fff3cd; color: #856404; }

        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        .input-area input:focus { border-color: #007AFF; }
        .input-area button { background: #007AFF; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .input-area button:hover { background: #0056b3; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }

        .loading { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/rag">文件导入</a>
            <a href="/rag/chat/index" class="active">RAG对话</a>
        </div>

        <div class="card">
            <h1>RAG 智能对话</h1>

            <div class="chat-container" id="chatContainer">
                <div class="message system">
                    👋 你好！我是基于 RAG 的智能助手。
                    请先在"文件导入"页面导入 TXT 文档，然后我可以根据文档内容回答你的问题。
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="promptInput" placeholder="请输入问题..." autocomplete="off">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(content, role = 'user') {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            promptInput.value = '';

            sendBtn.disabled = true;
            sendBtn.textContent = '思考中...';

            try {
                const formData = new FormData();
                formData.append('prompt', prompt);

                const response = await fetch('/rag/chat', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();

                if (response.ok) {
                    addMessage(text, 'assistant');
                } else {
                    addMessage('Error: ' + text, 'system');
                }
            } catch (error) {
                addMessage('Error: ' + error.message, 'system');
            }

            sendBtn.disabled = false;
            sendBtn.textContent = '发送';
        }

        sendBtn.addEventListener('click', sendMessage);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
