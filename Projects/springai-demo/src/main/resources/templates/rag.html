<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 向量库导入 - 阿坤AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        .nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .nav a { color: #666; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .nav a:hover { background: #f0f0f0; }
        .nav a.active { background: #007AFF; color: white; }
        .upload-area { border: 2px dashed #ddd; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: #007AFF; background: #f8f9fa; }
        .upload-area.dragover { border-color: #007AFF; background: #e8f4ff; }
        .upload-icon { font-size: 48px; color: #ccc; margin-bottom: 15px; }
        .upload-text { color: #666; margin-bottom: 10px; }
        .upload-hint { color: #999; font-size: 12px; }
        input[type="file"] { display: none; }
        .btn { background: #007AFF; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .result.success { background: #d4edda; color: #155724; display: block; }
        .result.error { background: #f8d7da; color: #721c24; display: block; }
        .info { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .info-title { font-weight: 600; margin-bottom: 10px; color: #333; }
        .info-item { color: #666; margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/rag">文件导入</a>
            <a href="/rag/chat/index">RAG对话</a>
        </div>

        <div class="card">
            <h1>导入 TXT 文件到向量库</h1>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击选择文件或拖拽文件到此处</div>
                <div class="upload-hint">支持 .txt 格式文件</div>
                <input type="file" id="fileInput" accept=".txt">
            </div>

            <button class="btn" id="uploadBtn" disabled>上传并导入向量库</button>

            <div class="result" id="result"></div>

            <div class="info">
                <div class="info-title">使用说明</div>
                <div class="info-item">1. 选择或拖拽 TXT 文件到上传区域</div>
                <div class="info-item">2. 点击"上传并导入向量库"按钮</div>
                <div class="info-item">3. 系统会自动将文本分块并转换为向量存储到 Elasticsearch</div>
                <div class="info-item">4. 导入完成后可使用 RAG 对话功能进行问答</div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const result = document.getElementById('result');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                uploadArea.querySelector('.upload-text').textContent = '已选择: ' + selectedFile.name;
                uploadBtn.disabled = false;
            }
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                uploadArea.querySelector('.upload-text').textContent = '已选择: ' + selectedFile.name;
                uploadBtn.disabled = false;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';
            result.className = 'result';
            result.textContent = '';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/rag/upload', {
                    method: 'POST',
                    body: formData
                });
                const text = await response.text();

                if (response.ok) {
                    result.className = 'result success';
                    result.textContent = text;
                } else {
                    result.className = 'result error';
                    result.textContent = text;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = '上传失败: ' + error.message;
            }

            uploadBtn.disabled = false;
            uploadBtn.textContent = '上传并导入向量库';
        });
    </script>
</body>
</html>
